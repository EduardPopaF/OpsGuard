services:
  postgres:
    image: postgres:17
    container_name: opsguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: opsguard
      POSTGRES_USER: opsguard
      POSTGRES_PASSWORD: opsguard_dev_password
    ports:
      - "5432:5432"
    volumes:
      - opsguard_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsguard -d opsguard"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  opsguard_postgres_data: