spring.application.name=opsguard-backend

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/opsguard
spring.datasource.username=opsguard
spring.datasource.password=opsguard_dev_password

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never